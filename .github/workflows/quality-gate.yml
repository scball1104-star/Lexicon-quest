name: Lexicon Quest Quality Gate
on:
  push:
    branches: [main, feature/v60-premium-rpg-foundation, feature/v61-guided-adventure, feature/v62-living-combat, feature/v63-art-rebuild, feature/v64-architectural-world, feature/v65-art-direction-and-playtest, feature/v66-release-candidate, feature/v67-willowmere-visual-rebuild]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    name: Full RPG + mobile QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact Netlify verification suite
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const toml = fs.readFileSync('netlify.toml', 'utf8');
          const match = toml.match(/^\s*command\s*=\s*"([^"]+)"/m);
          if (!match) throw new Error('Netlify build command not found.');
          console.log('Verifying the exact Netlify build command:', match[1]);
          cp.execSync(match[1], { stdio: 'inherit', shell: '/bin/bash' });
          NODE

  browser-smoke:
    name: Feature Chromium visual smoke
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/v60-premium-rpg-foundation' || github.ref == 'refs/heads/feature/v61-guided-adventure' || github.ref == 'refs/heads/feature/v62-living-combat' || github.ref == 'refs/heads/feature/v63-art-rebuild' || github.ref == 'refs/heads/feature/v64-architectural-world' || github.ref == 'refs/heads/feature/v65-art-direction-and-playtest' || github.ref == 'refs/heads/feature/v66-release-candidate' || github.ref == 'refs/heads/feature/v67-willowmere-visual-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium test runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise real desktop and mobile game
        run: |
          if [ "${{ github.head_ref }}" = "feature/v67-willowmere-visual-rebuild" ] || [ "${{ github.ref }}" = "refs/heads/feature/v67-willowmere-visual-rebuild" ]; then
            python qa/v67-browser-smoke.py
            python qa/v66-campaign-browser.py
          elif [ "${{ github.ref }}" = "refs/heads/feature/v66-release-candidate" ]; then
            python qa/v66-browser-smoke.py
            python qa/v66-campaign-browser.py
          elif [ "${{ github.ref }}" = "refs/heads/feature/v65-art-direction-and-playtest" ]; then
            python qa/v65-browser-smoke.py
            python qa/v65-campaign-browser.py
          elif [ "${{ github.ref }}" = "refs/heads/feature/v64-architectural-world" ]; then
            python qa/v64-browser-smoke.py
          elif [ "${{ github.ref }}" = "refs/heads/feature/v63-art-rebuild" ]; then
            python qa/v63-browser-smoke.py
          elif [ "${{ github.ref }}" = "refs/heads/feature/v62-living-combat" ]; then
            python qa/v62-browser-smoke.py
          elif [ "${{ github.ref }}" = "refs/heads/feature/v61-guided-adventure" ]; then
            python qa/v61-browser-smoke.py
          else
            python qa/v60-browser-smoke.py
          fi
      - name: Preserve screenshots for art review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexicon-branch-browser-previews
          path: previews/*.png
          if-no-files-found: ignore
