name: Episode One Browser Review
on:
  push:
    branches: [codex/episode-one-refinement]
  pull_request:
    paths:
      - '**.js'
      - '**.css'
      - 'index.html'
      - 'qa/episode-one-browser.py'
      - '.github/workflows/episode-one-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa/run-gate.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - run: python qa/episode-one-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-one-browser-review
          path: previews/episode-one-*.png
          if-no-files-found: ignore
